<page-header title="'镜像仓库访问'" breadcrumbs="[{label:'镜像仓库', link:'kubernetes.registries'}, $ctrl.registry.Name, '访问管理']" reload="true"> </page-header>

<registry-details registry="$ctrl.registry" ng-if="$ctrl.registry"></registry-details>

<div class="row">
  <div class="col-sm-12">
    <rd-widget>
      <rd-widget-header icon="user-x" title-text="创建访问"></rd-widget-header>
      <rd-widget-body>
        <form class="form-horizontal">
          <div class="form-group">
            <label class="col-sm-3 col-lg-2 control-label text-left" style="padding-top: 0"> 选择命名空间 </label>
            <div class="col-sm-9 col-lg-4" style="margin-bottom: 15px">
              <span class="small text-muted" ng-if="!$ctrl.resourcePools.length"> 没有可用命名空间。 </span>

              <namespaces-selector
                ng-if="$ctrl.resourcePools.length"
                value="$ctrl.selectedResourcePools"
                namespaces="$ctrl.resourcePools"
                placeholder="'选择一个或多个命名空间'"
                on-change="($ctrl.onChangeResourcePools)"
                allow-select-all="true"
              ></namespaces-selector>
            </div>
            <div class="col-sm-12 small text-muted vertical-center">
              <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon>
              添加此镜像仓库后，该命名空间中的所有用户都将能访问该镜像仓库凭据。
            </div>
          </div>

          <!-- actions -->
          <div class="form-group">
            <div class="col-sm-12">
              <button
                type="submit"
                class="btn btn-primary btn-sm !ml-0"
                ng-disabled="$ctrl.selectedResourcePools.length === 0 || $ctrl.state.actionInProgress"
                ng-click="$ctrl.submit()"
                button-spinner="$ctrl.state.actionInProgress"
              >
                <span ng-hide="$ctrl.state.actionInProgress" class="vertical-center"><pr-icon icon="'plus'" size="'sm'"></pr-icon> 创建访问</span>
                <span ng-show="$ctrl.state.actionInProgress">创建中...</span>
              </button>
            </div>
          </div>
          <!-- !actions -->
        </form>
      </rd-widget-body>
    </rd-widget>
  </div>
</div>

<kube-registry-access-table dataset="$ctrl.savedResourcePools" on-remove="($ctrl.handleRemove)"></kube-registry-access-table>
