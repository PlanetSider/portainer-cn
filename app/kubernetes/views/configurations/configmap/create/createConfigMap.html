<page-header
  ng-if="ctrl.state.viewReady"
  title="'创建 ConfigMap'"
  breadcrumbs="[{ label:'ConfigMap 与密钥', link:'kubernetes.configurations', linkParams:{ tab: 'configmaps' } }, '创建 ConfigMap']"
  reload="true"
></page-header>

<kubernetes-view-loading view-ready="ctrl.state.viewReady"></kubernetes-view-loading>

<div ng-if="ctrl.state.viewReady">
  <div class="row">
    <div class="col-xs-12">
      <rd-widget>
        <rd-widget-body>
          <form class="form-horizontal" name="kubernetesConfigurationCreationForm" autocomplete="off">
            <!-- resource-pool -->
            <div class="form-group" ng-if="ctrl.formValues.ResourcePool">
              <label for="resource-pool-selector" class="col-sm-3 col-lg-2 control-label text-left">命名空间</label>
              <div class="col-sm-8 col-lg-9">
                <select
                  class="form-control"
                  id="resource-pool-selector"
                  ng-model="ctrl.formValues.ResourcePool"
                  ng-options="resourcePool.Namespace.Name for resourcePool in ctrl.resourcePools"
                  ng-change="ctrl.onResourcePoolSelectionChange()"
                  data-cy="k8sConfigCreate-namespaceDropdown"
                ></select>
              </div>
            </div>
            <div class="form-group" ng-if="ctrl.state.resourcePoolHasQuota && ctrl.resourceQuotaCapacityExceeded() && ctrl.formValues.ResourcePool">
              <div class="col-sm-12 small text-warning vertical-center">
                <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon>
                此命名空间的资源容量已耗尽，你将无法部署该配置。请联系管理员扩展该命名空间的容量。
              </div>
            </div>
            <div class="form-group" ng-if="!ctrl.formValues.ResourcePool">
              <div class="col-sm-12 small text-warning vertical-center">
                <pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon>
                你无权访问任何命名空间。请联系管理员为你授予命名空间访问权限。
              </div>
            </div>
            <!-- !resource-pool -->

            <!-- name -->
            <div class="form-group">
              <label for="configuration_name" class="col-sm-3 col-lg-2 control-label required text-left">名称</label>
              <div class="col-sm-8 col-lg-9 mb-0">
                <input
                  type="text"
                  class="form-control"
                  name="configuration_name"
                  ng-model="ctrl.formValues.Name"
                  ng-pattern="/^[a-z0-9]([a-z0-9-.]{0,61}[a-z0-9])?$/"
                  ng-change="ctrl.onChangeName()"
                  placeholder="例如 my-configmap"
                  auto-focus
                  required
                  data-cy="k8sConfigCreate-nameInput"
                />
                <div ng-show="kubernetesConfigurationCreationForm.configuration_name.$invalid || ctrl.state.alreadyExist">
                  <div class="help-block small text-warning">
                    <div ng-messages="kubernetesConfigurationCreationForm.configuration_name.$error">
                      <p ng-message="required" class="vertical-center"><pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon> 此字段为必填项。</p>
                      <p ng-message="pattern" class="vertical-center"
                        ><pr-icon icon="'alert-triangle'" mode="'warning'" class="vertical-center"></pr-icon> 此字段必须由小写字母、数字、'-' 或 '.' 组成，最多 63 个字符，且必须以字母或数字开头和结尾。</p
                      >
                    </div>
                    <p ng-if="ctrl.state.alreadyExist" class="vertical-center"
                      ><pr-icon icon="'alert-triangle'" mode="'warning'"></pr-icon> 所选命名空间中已存在同名配置。</p
                    >
                  </div>
                </div>
              </div>
            </div>
            <!-- !name -->

            <div class="col-sm-12 !p-0">
              <annotations-be-teaser></annotations-be-teaser>
            </div>

            <div ng-if="ctrl.formValues.ResourcePool">
              <kubernetes-configuration-data
                ng-if="ctrl.formValues"
                form-values="ctrl.formValues"
                is-docker-config="ctrl.state.isDockerConfig"
                is-valid="ctrl.state.isDataValid"
                on-change-validation="ctrl.isFormValid()"
                is-creation="true"
                type="'configmap'"
                is-editor-dirty="ctrl.state.isEditorDirty"
              ></kubernetes-configuration-data>
            </div>

            <!-- summary -->
            <kubernetes-summary-view
              ng-if="!(!kubernetesConfigurationCreationForm.$valid || !ctrl.isFormValid() || ctrl.state.actionInProgress)"
              form-values="ctrl.formValues"
            ></kubernetes-summary-view>

            <!-- actions -->
            <div class="col-sm-12 form-section-title" style="margin-top: 10px"> 操作 </div>
            <div class="form-group">
              <div class="col-sm-12">
                <button
                  type="button"
                  class="btn btn-primary btn-sm !ml-0"
                  ng-disabled="!kubernetesConfigurationCreationForm.$valid || !ctrl.isFormValid() || ctrl.state.actionInProgress || !ctrl.formValues.ResourcePool"
                  ng-click="ctrl.createConfiguration()"
                  button-spinner="ctrl.state.actionInProgress"
                  data-cy="k8sConfigCreate-CreateConfigButton"
                >
                  <span ng-hide="ctrl.state.actionInProgress">创建{{ ctrl.formValues.Kind | kubernetesConfigurationKindText }}</span>
                  <span ng-show="ctrl.state.actionInProgress">创建中...</span>
                </button>
              </div>
            </div>
            <!-- !actions -->
          </form>
        </rd-widget-body>
      </rd-widget>
    </div>
  </div>
</div>
