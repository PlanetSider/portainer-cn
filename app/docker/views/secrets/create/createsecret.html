<page-header title="'创建密钥'" breadcrumbs="[{label:'密钥', link:'docker.secrets'}, '添加密钥']"> </page-header>

<div class="row">
  <div class="col-lg-12 col-md-12 col-xs-12">
    <rd-widget>
      <rd-widget-body>
        <form class="form-horizontal">
          <!-- name-input -->
          <div class="form-group">
            <label for="secret_name" class="col-sm-2 control-label text-left">名称</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" ng-model="formValues.Name" id="secret_name" placeholder="例如 my-secret" data-cy="createSecret-nameInput" />
            </div>
          </div>
          <!-- !name-input -->
          <!-- secret-data -->
          <div class="form-group">
            <label for="secret_data" class="col-sm-2 control-label text-left">密钥内容</label>
            <div class="col-sm-10">
              <textarea class="form-control" rows="5" ng-model="formValues.Data" ng-trim="false" data-cy="createSecret-secretDataInput"></textarea>
            </div>
          </div>
          <!-- !secret-data -->
          <!-- encode-secret -->
          <div class="form-group">
            <div class="col-sm-12">
              <por-switch-field
                label-class="'col-sm-2'"
                checked="formValues.encodeSecret"
                label="'编码密钥（Secret）'"
                on-change="(handleEncodeSecretChange)"
                tooltip="'密钥（Secret）需要进行 base64 编码。如果你的 Secret 已经是 base64 编码，请关闭此选项。'"
              ></por-switch-field>
            </div>
          </div>
          <!-- !encode-secret -->
          <!-- labels -->
          <div class="form-group">
            <div class="col-sm-12 mt-1">
              <label class="control-label space-right text-left">标签</label>
              <span class="label label-default interactive vertical-center space-left" ng-click="addLabel()"> <pr-icon icon="'plus'" mode="'alt'"></pr-icon> 添加标签 </span>
            </div>
            <!-- labels-input-list -->
            <div class="col-sm-12 form-inline mt-2">
              <div ng-repeat="label in formValues.Labels" class="mt-1">
                <div class="input-group col-sm-5 input-group-sm">
                  <span class="input-group-addon">名称</span>
                  <input type="text" class="form-control" ng-model="label.key" placeholder="例如 com.example.foo" data-cy="createSecret-labelNameInput" />
                </div>
                <div class="input-group col-sm-6 input-group-sm">
                  <span class="input-group-addon">值</span>
                  <input type="text" class="form-control" ng-model="label.value" placeholder="例如 bar" data-cy="createSecret-labelValueInput" />
                  <span class="input-group-btn">
                    <button class="btn btn-dangerlight" type="button" ng-click="removeLabel($index)">
                      <pr-icon icon="'trash-2'" size="'md'"></pr-icon>
                    </button>
                  </span>
                </div>
              </div>
            </div>
            <!-- !labels-input-list -->
          </div>
          <!-- !labels-->
          <!-- access-control -->
          <por-access-control-form form-data="formValues.AccessControlData"></por-access-control-form>
          <!-- !access-control -->
          <!-- actions -->
          <div class="col-sm-12 form-section-title"> 操作 </div>
          <div class="form-group">
            <div class="col-sm-12">
              <button
                type="button"
                class="btn btn-primary btn-sm"
                ng-disabled="state.actionInProgress || !formValues.Name || !formValues.Data"
                ng-click="create()"
                button-spinner="state.actionInProgress"
              >
                <span ng-hide="state.actionInProgress">创建密钥</span>
                <span ng-show="state.actionInProgress">正在创建密钥...</span>
              </button>
              <span class="text-danger space-left" ng-if="state.formValidationError">{{ state.formValidationError }}</span>
            </div>
          </div>
          <!-- !actions -->
        </form>
      </rd-widget-body>
    </rd-widget>
  </div>
</div>
